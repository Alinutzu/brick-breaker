<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Brick Breaker PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f1226" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #0f1226; color: #eaeaf0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;
      overscroll-behavior: none; }
    body { overflow-x: hidden; overflow-y: hidden; }

    #wrap { position: fixed; inset: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      gap: 8px; padding: 8px; width: 100%; }

    canvas { display: block; width: 100%; height: calc(100vh - 160px);
      background: #11162e; border: 1px solid #2a2f55; box-shadow: 0 0 24px rgba(34,102,255,0.25);
      touch-action: none; z-index: 0; }

    .hud { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; width: 100%; z-index: 100; }
    .btn { background: #2266ff; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
    .btn:active { transform: translateY(1px); }
    .legend { font-size: 12px; opacity: 0.85; text-align: center; padding: 0 8px; }
    .tag { padding: 2px 8px; border-radius: 999px; background: #1b2a5e; font-size: 12px; }

    #menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.55); backdrop-filter: blur(3px); z-index: 1000; }
    .panel { background: #0f1430; border: 1px solid #2a2f55; box-shadow: 0 12px 40px rgba(34,102,255,0.25); border-radius: 10px; padding: 16px; width: min(760px, 92vw); max-height: 92vh; overflow: auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(80px,1fr)); gap: 8px; }
    .levelbtn { padding: 10px; text-align: center; border: 1px solid #2a2f55; border-radius: 8px; background: #12183a; cursor: pointer; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    [hidden] { display: none !important; }
    .hidden { display: none !important; pointer-events: none; }

    #timers { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
    .timer { display: flex; align-items: center; gap: 6px; }
    .bar { width: 120px; height: 8px; border-radius: 999px; background: #1b2a5e; overflow: hidden; }
    .fill { height: 100%; background: linear-gradient(90deg, #ffd166, #ffffff); }
    .fill-pierce { background: linear-gradient(90deg, #ef476f, #ffffff); }

    /* Touch L/R overlay aligned to canvas area only */
    #touchControls { position: fixed; left: 0; top: 0; width: 0; height: 0; display: none; z-index: 5; }
    .zone { position: absolute; top: 0; bottom: 0; width: 50%; opacity: 0; touch-action: none; }
    .zone.left { left: 0; }
    .zone.right { right: 0; }

    /* Settings form */
    .form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
    .form .item { background: #12183a; border: 1px solid #2a2f55; border-radius: 8px; padding: 10px; }
    .form label { display: flex; align-items: center; gap: 8px; }
    .select { width: 100%; padding: 6px; border-radius: 6px; border: 1px solid #2a2f55; background:#0f1430; color:#eaeaf0; }
  </style>
</head>
<body>
  <div id="wrap">
    <h1 style="margin:6px 0 0">Brick Breaker – PWA</h1>
    <div class="hud">
      <div class="tag">Mod: <span id="modeTag">Nivel</span></div>
      <div class="tag">Scor: <span id="score">0</span></div>
      <div class="tag">Vieți: <span id="lives">3</span></div>
      <div class="tag">Etapa: <span id="stage">1</span></div>
      <button id="menuBtn" class="btn">Meniu</button>
      <button id="reset" class="btn">Reset</button>
      <button id="pause" class="btn">Pauză</button>
      <button id="soundBtn" class="btn" title="Sound On/Off">🔊 Sunet: ON</button>
      <button id="installBtn" class="btn" style="display:none">Instalează</button>
    </div>
    <div id="timers">
      <div class="timer" id="wideTimerBox" hidden>
        <span>Wide</span>
        <div class="bar"><div class="fill" id="wideFill" style="width:0%"></div></div>
      </div>
      <div class="timer" id="pierceTimerBox" hidden>
        <span>Pierce</span>
        <div class="bar"><div class="fill fill-pierce" id="pierceFill" style="width:0%"></div></div>
      </div>
    </div>
    <canvas id="game" width="800" height="600" aria-label="Brick Breaker"></canvas>
    <div class="legend">Controale: ←/→, A/D, P pauză, R reset. Pe mobil: Drag paleta sau Tap stânga/dreapta.</div>
  </div>

  <!-- Meniu (Level + Settings) -->
  <div id="menu" class="hidden" hidden>
    <div class="panel">
      <h2>Meniu</h2>
      <div class="row">
        <button id="chooseLevelMode" class="btn">Mod Nivel</button>
        <button id="chooseEndless" class="btn">Mod Endless</button>
        <div style="flex:1"></div>
        <button id="closeMenu" class="btn" title="ESC">Închide</button>
      </div>
      <hr/>
      <h3>Niveluri</h3>
      <div class="grid" id="levelGrid"></div>
      <hr/>
      <h3>Setări</h3>
      <div class="form">
        <div class="item"><label><input type="checkbox" id="optSound"> Sunet ON</label></div>
        <div class="item"><label><input type="checkbox" id="optParticles"> Particule ON</label></div>
        <div class="item">
          <label style="justify-content:space-between;width:100%">
            Control mobil
            <select id="optControl" class="select">
              <option value="drag">Drag paleta</option>
              <option value="tap">Tap Stânga/Dreapta</option>
            </select>
          </label>
        </div>
        <div class="item">
          <label style="justify-content:space-between;width:100%">
            Temă
            <select id="optTheme" class="select">
              <option value="color">Color</option>
              <option value="retro">Retro alb-negru</option>
            </select>
          </label>
        </div>
        <div class="item">
          <label style="justify-content:space-between;width:100%">
            Dificultate
            <select id="optDifficulty" class="select">
              <option value="normal">Normal</option>
              <option value="hard">Hard</option>
            </select>
          </label>
        </div>
        <div class="item"><button id="saveSettings" class="btn" style="width:100%">Salvează setări</button></div>
      </div>
    </div>
  </div>

  <!-- Touch controls (aligned to canvas only) -->
  <div id="touchControls">
    <div class="zone left"></div>
    <div class="zone right"></div>
  </div>

  <!-- Scripts -->
  <script defer src="./levels.js"></script>
  <script defer src="./game_settings.js"></script>
  <script defer src="./pwa.js"></script>
</body>
</html>
